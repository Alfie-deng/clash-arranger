[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-arranger"
version = "0.1.0"
description = "Clash node arranger: ordered Mihomo/Clash fallback seats from historical throughput and live probes."
readme = "README.en.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Clash Arranger contributors" }]
keywords = ["mihomo", "clash", "proxy", "fallback", "ranking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: System Administrators",
  "Topic :: System :: Networking",
]
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
ssh = []

[project.scripts]
clash-arranger = "clash_arranger.cli:main"

[project.urls]
Homepage = "https://github.com/Alfie-deng/clash-arranger"
Issues = "https://github.com/Alfie-deng/clash-arranger/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731"]

[tool.mypy]
python_version = "3.11"
pretty = true
warn_unused_ignores = true
ignore_missing_imports = false
packages = ["clash_arranger"]
mypy_path = "src"
